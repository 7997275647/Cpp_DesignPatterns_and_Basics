name: Build and Test

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    name: Build (Ubuntu)
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ninja-build cmake
        cmake --version
    
    - name: Create build directory
      run: mkdir -p build
    
    - name: Configure project
      run: |
        cd build
        cmake -G "Unix Makefiles" \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DCMAKE_CXX_STANDARD=17 \
          ..
    
    - name: Build project
      run: |
        cd build
        cmake --build . --config ${{ matrix.config }}
    
    - name: Run application (Release)
      if: matrix.config == 'Release'
      run: |
        ./build/bin/Release/CppDesignPatterns
    
    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-ubuntu-${{ matrix.config }}
        path: build/bin/
        retention-days: 7

  code-quality:
    name: Code Quality & SCA
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang-format cppcheck clang cmake
        cmake --version
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: 'cpp'
    
    - name: Run cppcheck
      run: |
        cppcheck --enable=all \
          --suppress=missingIncludeSystem \
          --suppress=unusedFunction \
          --error-exitcode=1 \
          --std=c++17 \
          --inline-suppr \
          Application/ Basics/ DesignPatterns/
      continue-on-error: true
    
    - name: Check formatting
      run: |
        find Application Basics DesignPatterns -name "*.cpp" -o -name "*.hpp" | \
        xargs clang-format --dry-run --Werror
      continue-on-error: true
    
    - name: Build for CodeQL Analysis
      run: |
        mkdir -p build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17 ..
        cmake --build . --config Release
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      with:
        category: "/language:cpp"
